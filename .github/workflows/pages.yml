name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generar datos
        run: npm run build:data
      - name: Lint, tipos y pruebas
        run: npm run check
      - name: Armar sitio
        run: |
          mkdir _site
          cp -r index.html styles.css sw.js manifest.webmanifest src icons _site/
          rm -f _site/src/*.d.ts
          mkdir _site/data && cp data/transmetro.json _site/data/
          # Versión única por publicación: obliga a los celulares a instalar el service worker nuevo.
          sed -i "s/__VERSION__/${GITHUB_SHA::12}/" _site/sw.js
          grep -q "moviliz-${GITHUB_SHA::12}" _site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
