name: CI

# Revisa cada PR antes de fusionarlo. El despliegue (pages.yml) repite
# las mismas revisiones antes de publicar.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tipos (JSDoc + tsc)
        run: npm run type-check
      - name: Datos al día
        # data/transmetro.json se versiona: si alguien cambia data/raw/ sin regenerarlo, falla.
        run: |
          npm run build:data
          git diff --exit-code -- data/transmetro.json
      - name: Pruebas
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Pruebas E2E (offline, 390 px, accesibilidad, CSP)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lighthouse (rendimiento ≥ 90, accesibilidad 100, buenas prácticas ≥ 95, SEO ≥ 90)
        run: npm run lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 7
